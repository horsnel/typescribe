<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typescribe — Offline</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050507;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 420px; }
    .badge {
      width: 88px; height: 88px; margin: 0 auto 24px;
      border-radius: 20px;
      background: #0B0B10;
      border: 1px solid rgba(212,168,83,0.35);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(212,168,83,0.08);
    }
    .badge svg { width: 44px; height: 44px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; letter-spacing: -0.02em; }
    p { color: #9ca3af; font-size: 0.95rem; line-height: 1.6; margin-bottom: 26px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(135deg, #E8C97A, #D4A853 55%, #B8922F);
      color: #141414; font-weight: 700; font-size: 0.95rem;
      padding: 12px 28px; border-radius: 10px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .hint { margin-top: 18px; font-size: 0.78rem; color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E8C97A"/>
            <stop offset="0.55" stop-color="#D4A853"/>
            <stop offset="1" stop-color="#B8922F"/>
          </linearGradient>
        </defs>
        <g fill="url(#g)">
          <path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09 C6.16,7.1,15.47,7.1,15.47,7.1z"/>
          <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
          <path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>
        </g>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>Typescribe needs a connection to bring you fresh reviews, ratings, and streams. Check your network and try again.</p>
    <button onclick="location.replace('/')">Try again</button>
    <p class="hint">Pages you visited recently may still open from cache.</p>
  </div>
</body>
</html>
